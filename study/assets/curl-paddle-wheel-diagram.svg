<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Curl as the rotation of a tiny paddle wheel</title>
  <desc id="desc">Rightward flow is faster above the wheel than below it, so the wheel rotates clockwise when viewed from above.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#007c83"/></marker>
    <marker id="arrow-navy" viewBox="0 0 10 6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#123d73"/></marker>
  </defs>
  <rect width="900" height="500" fill="#fbfcfe"/>
  <text x="450" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123d73">Curl: a tiny wheel’s local rotation</text>
  <text x="450" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#31445c">Flow is faster above the wheel and slower below it.</text>
  <g stroke="#dce4ec" stroke-width="1">
    <path d="M60 120H840 M60 180H840 M60 240H840 M60 300H840 M60 360H840 M60 420H840"/>
    <path d="M100 105V435 M180 105V435 M260 105V435 M340 105V435 M420 105V435 M500 105V435 M580 105V435 M660 105V435 M740 105V435 M820 105V435"/>
  </g>
  <g stroke="#007c83" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-teal)">
    <path d="M100 140H300 M385 140H600 M680 140H820"/>
    <path d="M110 205H280 M390 205H565 M680 205H810"/>
    <path d="M120 270H255 M405 270H545 M690 270H800"/>
    <path d="M130 335H230 M420 335H525 M700 335H790"/>
    <path d="M140 400H205 M430 400H500 M710 400H780"/>
  </g>
  <g fill="#007c83">
    <path d="M300 132L318 140L300 148Z M600 132L618 140L600 148Z M820 132L838 140L820 148Z"/>
    <path d="M280 197L298 205L280 213Z M565 197L583 205L565 213Z M810 197L828 205L810 213Z"/>
    <path d="M255 262L273 270L255 278Z M545 262L563 270L545 278Z M800 262L818 270L800 278Z"/>
    <path d="M230 327L248 335L230 343Z M525 327L543 335L525 343Z M790 327L808 335L790 343Z"/>
    <path d="M205 392L223 400L205 408Z M500 392L518 400L500 408Z M780 392L798 400L780 408Z"/>
  </g>
  <circle cx="450" cy="270" r="85" fill="#eaf3ff" stroke="#123d73" stroke-width="5"/>
  <g stroke="#2c78bd" stroke-width="15" stroke-linecap="round">
    <path d="M450 270L450 198 M450 270L510 234 M450 270L510 306 M450 270L450 342 M450 270L390 306 M450 270L390 234"/>
  </g>
  <circle cx="450" cy="270" r="15" fill="#123d73"/>
  <path d="M360 180 A128 128 0 0 1 565 300" fill="none" stroke="#c0504d" stroke-width="6" marker-end="url(#arrow-navy)"/>
  <path d="M553 292L570 300L553 308Z" fill="#c0504d"/>
  <text x="610" y="318" font-family="sans-serif" font-size="18" font-weight="700" fill="#9a3431">clockwise turning</text>
  <path d="M450 270V105" stroke="#123d73" stroke-width="5" marker-end="url(#arrow-navy)"/>
  <path d="M441 121L450 102L459 121Z" fill="#123d73"/>
  <text x="463" y="115" font-family="sans-serif" font-size="17" fill="#123d73">view from above</text>
</svg>
