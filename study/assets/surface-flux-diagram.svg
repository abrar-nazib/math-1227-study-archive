<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Flux through a surface</title>
  <desc id="desc">A horizontal surface patch has an upward normal. A field arrow is split into a through-surface component and a sliding component.</desc>
  <defs>
    <marker id="arrow-field" viewBox="0 0 10 6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#007c83"/></marker>
    <marker id="arrow-normal" viewBox="0 0 10 6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#123d73"/></marker>
  </defs>
  <rect width="900" height="500" fill="#fbfcfe"/>
  <text x="450" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123d73">Flux: what passes through a surface</text>
  <text x="450" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#31445c">The normal selects the component that goes through the surface.</text>
  <path d="M165 330 L590 245 L760 335 L335 420 Z" fill="#f7d887" fill-opacity="0.72" stroke="#a27200" stroke-width="4"/>
  <path d="M165 330 L335 420 M590 245 L760 335" stroke="#caa53e" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="725" y="385" font-family="sans-serif" font-size="17" fill="#755800">surface patch</text>
  <path d="M465 305V112" stroke="#123d73" stroke-width="7" marker-end="url(#arrow-normal)"/>
  <text x="479" y="128" font-family="sans-serif" font-size="18" font-weight="700" fill="#123d73">chosen normal</text>
  <path d="M255 145 L465 305" stroke="#007c83" stroke-width="8" marker-end="url(#arrow-field)"/>
  <text x="215" y="137" font-family="sans-serif" font-size="18" fill="#007c83">field arrow</text>
  <path d="M465 305V202" stroke="#c0504d" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#arrow-normal)"/>
  <path d="M465 305 L575 283" stroke="#7a8795" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#arrow-field)"/>
  <text x="480" y="215" font-family="sans-serif" font-size="16" fill="#9a3431">through-surface part</text>
  <text x="580" y="275" font-family="sans-serif" font-size="16" fill="#5a6877">sliding part</text>
  <path d="M135 445H790" stroke="#dce4ec" stroke-width="2"/>
  <text x="450" y="470" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#31445c">Only the component parallel to the normal contributes to flux.</text>
</svg>
